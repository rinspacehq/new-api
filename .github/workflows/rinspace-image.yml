name: Publish Rinspace gateway image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed commit on main
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'rinspacehq/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate source commit
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=rin-${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main ancestry and source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD
          test "$(git remote get-url origin)" = 'https://github.com/rinspacehq/new-api'
          printf 'rin-%s\n' "${SOURCE_SHA:0:12}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rinspacehq/new-api:${{ steps.source.outputs.tag }}
          provenance: mode=max
          sbom: true

      - name: Record immutable image
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          printf 'Source: `%s`\n\nImage: `ghcr.io/rinspacehq/new-api@%s`\n' "$SOURCE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
